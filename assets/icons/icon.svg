<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Cherry Blossom Cafe app icon: a strawberry jam jar with a gingham lid.
       The background fills the whole square: iPhones round the corners themselves. -->
  <style>
    @font-face { font-family: "Mochiy Pop One"; src: url("../fonts/mochiy-pop-one-latin.woff2") format("woff2"); }
    .name { font-family: "Mochiy Pop One", "Nunito", sans-serif; text-anchor: middle; fill: #d9486c; }
  </style>
  <defs>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="3" fill="#f6c3cf" opacity="0.55"/>
      <circle cx="30" cy="30" r="3" fill="#f6c3cf" opacity="0.55"/>
    </pattern>
    <pattern id="gingham" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(-4)">
      <rect width="36" height="36" fill="#fff4f5"/>
      <rect width="18" height="36" fill="#f39ab0" opacity="0.55"/>
      <rect width="36" height="18" fill="#f39ab0" opacity="0.55"/>
    </pattern>
    <linearGradient id="jam" x1="0" x2="1">
      <stop offset="0" stop-color="#f27a90"/>
      <stop offset="0.45" stop-color="#e2506b"/>
      <stop offset="1" stop-color="#c63a55"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#fdf3e8"/>
  <rect width="512" height="512" fill="url(#dots)"/>
  <ellipse cx="256" cy="488" rx="160" ry="14" fill="#ecd8cb"/>

